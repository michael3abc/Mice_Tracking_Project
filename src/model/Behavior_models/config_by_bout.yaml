data:
  path: "data_prediction\\dataset\\kpt_gt_behavior\\kpts_with_gt_behavior_yolov11.csv"
  # path: "data_prediction\\dataset\\kpt_gt_behavior\\kpts_with_gt_behavior_yolov8.csv"

  orig_size: [320, 240]

sliding_window:
  window_size: 32  
  stride:      8
  min_pad_ratio: 0.6
  pad_mode: "interp"
  

sampling:
  test_videos:      [8, 9]
  n_per_behavior:   2000
  max_win_per_behavior: {'rest':1000, 'default': 2000}


# 速度、加速度隔幾幀看
vel_delta: 3

# savgol_filter
smooth:
  window_length: 3
  polyorder: 1

split:
  val_size: 0.2


dataloader:
  batch_size: 512
  for_lstm: true
  num_workers: 8 # 平行讀取 的子程序數量
  pin_memory: true # 優化 CPU→GPU 的記憶體copy

train:
  epochs:       100
  lr:           1e-3         # base_lr
  warmup_epochs: 0           # 前 5 個 epoch 做 warm‐up
  device:       "cuda"
  seed:         42
  label_smoothing: 0
  weight: [1.0, 1.0, 0.9, 1.2, 1.0, 0.8, 1.1]

class_improvement:
  rest_threshold: 0.8
  rest_margin_weight: 0.5

  micro_threshold:  0.7
  micro_margin_weight: 0.5


early_stopping: 
  patience:  20
  min_delta:   1e-5




optimizer:
  type:          "AdamW"
  betas:         [0.9, 0.999]
  eps:           1e-8
  weight_decay:  1e-3

scheduler:
  plateau:
    mode:       min
    factor:     0.5
    patience:   2
    threshold:  0.0001
    min_lr:     1e-6


