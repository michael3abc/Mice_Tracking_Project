model:
  name: "STTR_BiLSTM"
  params:
    num_classes: 7
    stgcn_channels: [64, 64]
    sttr_dims: [64, 64]    
    num_heads: 4
    tcn_kernel: 9
    dropout: 0.3
    num_layers: 2
    # BiLSTM
    lstm_input: 55
    lstm_hidden : 128
    lstm_layers : 3
    se_ratio : 16
    dropout_p : 0.15





